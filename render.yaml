previews:
  generation: "off"

services:
  - type: web
    name: whale-buddy-ads-control-plane
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    disk:
      name: gmv-max-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CONFIG_PATH
        value: /app/config/punpan_020.control-plane.json
      - key: DATABASE_PATH
        value: /app/data/gmv-max.sqlite
      - key: CONTROL_PLANE_ONLY
        value: "true"
      - key: EXECUTION_ENABLED
        value: "false"
      - key: MONITOR_ENABLED
        value: "false"
      - key: STARTUP_VALIDATION_ENABLED
        value: "false"
      - key: TIKTOK_API_CONTROL_ENABLED
        value: "false"
      - key: TIKTOK_APP_ID
        value: "7667234745498992657"
      - key: TIKTOK_APP_SECRET
        sync: false
      - key: TIKTOK_OAUTH_REDIRECT_URI
        value: https://whale-buddy-ads-control-plane.onrender.com/oauth/tiktok/callback
      - key: TIKTOK_OAUTH_STATE_SECRET
        generateValue: true
      - key: TIKTOK_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: TIKTOK_OAUTH_ADMIN_LINE_USER_IDS
        sync: false
      - key: CHROME_TELEMETRY_ENABLED
        value: "true"
      - key: CHROME_TELEMETRY_ALERTS_ENABLED
        value: "false"
      - key: CHROME_TELEMETRY_MAX_CLOCK_SKEW_SECONDS
        value: "300"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
